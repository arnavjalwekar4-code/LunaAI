<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0914;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* App Loader */
    #app-loader {
      position: fixed;
      inset: 0;
      background: #0b0914;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #f472b6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Layout */
    .sidebar {
      width: 260px;
      background: #120f24;
      border-right: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: #2a2438;
    }
    .brand h2 {
      font-size: 1.1rem;
      color: #f3e8ff;
    }

    .new-chat-btn {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .new-chat-btn:hover { opacity: 0.9; }

    .recents-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .recent-item-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 6px;
      background: transparent;
      transition: background 0.2s;
    }
    .recent-item-container:hover, .recent-item-container.active {
      background: rgba(255, 255, 255, 0.05);
    }
    .recent-item {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-action-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }
    .sidebar-action-btn:hover { color: #f43f5e; }

    .sidebar-footer {
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* Main Chat Frame */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .hero-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      text-align: center;
    }
    .hero-title {
      font-size: 2rem;
      background: linear-gradient(135deg, #f472b6, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .chips-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      background: #1a152e;
      border: 1px solid rgba(255,255,255,0.08);
      color: #d8b4fe;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover {
      border-color: #f472b6;
      background: #231b3d;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15%;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }
    .msg-wrapper.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg-wrapper.luna {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg {
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }
    .user .msg {
      background: linear-gradient(135deg, #501d4a, #311347);
      color: #fdf2f8;
      border-bottom-right-radius: 4px;
    }
    .luna .msg {
      background: #181329;
      color: #f1f5f9;
      border: 1px solid rgba(255,255,255,0.05);
      border-bottom-left-radius: 4px;
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .action-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .action-btn:hover { color: #cbd5e1; }
    .action-btn svg { width: 12px; height: 12px; fill: currentColor; }

    /* Input Bar */
    .input-container {
      padding: 16px 15%;
      background: #0b0914;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-box {
      flex: 1;
      background: #15102a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 12px 20px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    .input-box:focus {
      border-color: #a855f7;
    }
    .input-container.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .icon-btn {
      background: #1e1838;
      border: 1px solid rgba(255,255,255,0.08);
      color: #e2e8f0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover { background: #2e2454; }
    .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .mic-active {
      background: #ef4444 !important;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { to { transform: scale(1.08); } }

    /* Typing Indicator */
    .typing-orb-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: #a855f7;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    /* Speaker Voice Wave Animation */
    .speaker-wave-container {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .speaker-wave-bar {
      width: 3px;
      height: 10px;
      background: linear-gradient(180deg, #f472b6, #a855f7);
      border-radius: 2px;
      animation: soundWave 0.5s infinite ease-in-out alternate;
    }
    .speaker-wave-bar:nth-child(1) { animation-delay: 0.0s; }
    .speaker-wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .speaker-wave-bar:nth-child(3) { animation-delay: 0.3s; }
    @keyframes soundWave {
      0% { height: 4px; opacity: 0.4; }
      100% { height: 16px; opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="app-loader">
    <div class="spinner"></div>
  </div>

  <div class="sidebar">
    <div class="brand" onclick="document.getElementById('logo-upload').click()">
      <img id="brand-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f472b6'%3E%3Cpath d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z'/%3E%3C/svg%3E" alt="Logo">
      <h2>Luna AI</h2>
      <input type="file" id="logo-upload" style="display:none" accept="image/*" onchange="uploadCustomLogo(event)">
    </div>

    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> New Chat
    </button>

    <div class="recents-container" id="recents-list"></div>

    <div class="sidebar-footer">
      <button class="icon-btn" onclick="toggleMute()" title="Toggle Sound">
        <svg id="muteIcon" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="hero-section" id="hero">
      <h1 class="hero-title">Where shall we begin?</h1>
      <div class="chips-container">
        <div class="chip" onclick="useChip('Who created you?')">Who created you?</div>
        <div class="chip" onclick="useChip('Write a quick poem')">Write a quick poem</div>
        <div class="chip" onclick="useChip('What can you do?')">What can you do?</div>
      </div>
    </div>

    <div class="chat-area" id="chat"></div>

    <div class="input-container" id="inputContainer">
      <input type="text" id="userInput" class="input-box" placeholder="Ask Luna anything..." onkeydown="if(event.key==='Enter') sendText()">
      <button class="icon-btn" id="micBtn" onclick="startVoice()" title="Voice Input">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
      <button class="icon-btn" id="sendBtn" onclick="sendText()" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    let isListening = false;
    let isMuted = false;
    let isReplying = false;
    let sessions = JSON.parse(localStorage.getItem('luna_sessions') || '[]');
    let currentSessionId = null;
    let speechRecognitionInstance = null;
    let femaleVoice = null;

    const SVG_ICONS = {
      chat: `<svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor;"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>`,
      trash: `<svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`,
      copy: `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`,
      check: `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`,
      soundOn: `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`,
      soundOff: `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`
    };

    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function saveSessions() {
      localStorage.setItem('luna_sessions', JSON.stringify(sessions));
    }

    function loadFemaleVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      
      const femaleKeywords = ['zira', 'samantha', 'victoria', 'karen', 'female', 'siri', 'moira', 'fiona', 'veena', 'google us english'];
      femaleVoice = voices.find(v => femaleKeywords.some(kw => v.name.toLowerCase().includes(kw))) 
                 || voices.find(v => v.lang.startsWith('en')) 
                 || voices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadFemaleVoice;
      loadFemaleVoice();
    }

    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      if (isMuted) return;
      try {
        initAudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.style.display = 'none', 600);
        }
      }, 700);

      const savedLogo = localStorage.getItem('luna_custom_logo');
      if (savedLogo) {
        document.getElementById('brand-logo').src = savedLogo;
      }

      renderRecents();
    });

    function setInputCooldown(state) {
      isReplying = state;
      const inputContainer = document.getElementById('inputContainer');
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const micBtn = document.getElementById('micBtn');

      if (state) {
        inputContainer.classList.add('disabled');
        input.disabled = true;
        sendBtn.disabled = true;
        micBtn.disabled = true;
      } else {
        inputContainer.classList.remove('disabled');
        input.disabled = false;
        sendBtn.disabled = false;
        micBtn.disabled = false;
        input.focus();
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('muteIcon').innerHTML = isMuted ? SVG_ICONS.soundOff : SVG_ICONS.soundOn;
      if (isMuted && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        removeSpeakerAnimation();
      }
    }

    function uploadCustomLogo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const logoUrl = e.target.result;
          document.getElementById('brand-logo').src = logoUrl;
          localStorage.setItem('luna_custom_logo', logoUrl);
        };
        reader.readAsDataURL(file);
      }
    }

    function createNewChat() {
      if (isReplying) return;
      playBeep(500, 'sine', 0.1);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        removeSpeakerAnimation();
      }
      currentSessionId = null;
      document.getElementById('chat').innerHTML = '';
      document.getElementById('chat').style.display = 'none';
      document.getElementById('hero').style.display = 'flex';
      renderRecents();
    }

    function renderRecents() {
      const list = document.getElementById('recents-list');
      list.innerHTML = '';
      sessions.forEach(session => {
        const container = document.createElement('div');
        container.className = `recent-item-container ${session.id === currentSessionId ? 'active' : ''}`;
        
        const btn = document.createElement('button');
        btn.className = 'recent-item';
        btn.innerHTML = `${SVG_ICONS.chat} <span>${session.title}</span>`;
        btn.onclick = () => loadSession(session.id);

        const delBtn = document.createElement('button');
        delBtn.className = 'sidebar-action-btn';
        delBtn.innerHTML = SVG_ICONS.trash;
        delBtn.onclick = (e) => {
          e.stopPropagation();
          sessions = sessions.filter(s => s.id !== session.id);
          saveSessions();
          if (currentSessionId === session.id) createNewChat();
          else renderRecents();
        };

        container.appendChild(btn);
        container.appendChild(delBtn);
        list.appendChild(container);
      });
    }

    function loadSession(id) {
      if (isReplying) return;
      const session = sessions.find(s => s.id === id);
      if (!session) return;

      currentSessionId = id;
      document.getElementById('hero').style.display = 'none';
      const chat = document.getElementById('chat');
      chat.style.display = 'flex';
      chat.innerHTML = '';

      session.messages.forEach((m, idx) => {
        renderMessageBubble(m.text, m.sender, idx, false, false);
      });
      renderRecents();
    }

    function useChip(text) {
      if (isReplying) return;
      document.getElementById('userInput').value = text;
      sendText();
    }

    function generateAssistantReply(userText) {
      const lower = userText.trim().toLowerCase();
      if (lower.includes('creator') || lower.includes('who created you')) {
        return "I was created by Arnav Jalwekar, a Senior Developer and Game Engineer! 🚀✨";
      }
      if (lower.includes('poem')) {
        return "Whispers of violet in the starry night, code weaves magic, vibrant and bright! ✨🔮";
      }
      if (lower.includes('what can you do')) {
        return "I can talk with you, remember your chats, convert voice to text, and speak out answers! 🚀🎨";
      }
      if (/^(hi|hello|hey|wsg|yo)$/i.test(lower)) {
        return "Hey there! How can I help you today? ✨";
      }
      return "I am up and running! How can I help you today? 🚀";
    }

    async function sendText() {
      if (isReplying) return;
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      setInputCooldown(true);
      playBeep(600, 'sine', 0.08);

      document.getElementById('hero').style.display = 'none';
      const chat = document.getElementById('chat');
      chat.style.display = 'flex';

      if (!currentSessionId) {
        currentSessionId = Date.now();
        sessions.unshift({
          id: currentSessionId,
          title: text.length > 22 ? text.substring(0, 22) + '...' : text,
          messages: []
        });
      }

      const sess = sessions.find(s => s.id === currentSessionId);
      sess.messages.push({ text, sender: 'user' });

      renderMessageBubble(text, 'user', sess.messages.length - 1, false, true);
      input.value = '';
      saveSessions();
      renderRecents();

      const typingIndicator = showTypingIndicator();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        typingIndicator.remove();

        let replyText = (data && data.success && data.reply) ? data.reply : generateAssistantReply(text);

        playBeep(880, 'sine', 0.12);
        sess.messages.push({ text: replyText, sender: 'luna' });
        saveSessions();
        const msgBubble = renderMessageBubble(replyText, 'luna', sess.messages.length - 1, true, false);
        speakOutLoud(replyText, msgBubble);

      } catch (err) {
        typingIndicator.remove();
        const fallbackReply = generateAssistantReply(text);
        sess.messages.push({ text: fallbackReply, sender: 'luna' });
        saveSessions();
        const msgBubble = renderMessageBubble(fallbackReply, 'luna', sess.messages.length - 1, true, false);
        speakOutLoud(fallbackReply, msgBubble);
      }
    }

    function renderMessageBubble(text, sender, index, animateTyping = false, isLatestUser = false) {
      const chat = document.getElementById('chat');
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${sender}`;

      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg';

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-btn';
      copyBtn.innerHTML = `${SVG_ICONS.copy} Copy`;
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text);
        copyBtn.innerHTML = `${SVG_ICONS.check} Copied`;
        setTimeout(() => copyBtn.innerHTML = `${SVG_ICONS.copy} Copy`, 1500);
      };
      actionsDiv.appendChild(copyBtn);

      wrapper.appendChild(msgDiv);
      wrapper.appendChild(actionsDiv);
      chat.appendChild(wrapper);

      if (animateTyping && sender === 'luna') {
        let i = 0;
        function type() {
          if (i < text.length) {
            msgDiv.innerText = text.substring(0, i + 1);
            i++;
            chat.scrollTop = chat.scrollHeight;
            setTimeout(type, 15);
          } else {
            setInputCooldown(false);
          }
        }
        type();
      } else {
        msgDiv.innerText = text;
        chat.scrollTop = chat.scrollHeight;
        if (sender === 'luna') setInputCooldown(false);
      }

      return msgDiv;
    }

    function showTypingIndicator() {
      const chat = document.getElementById('chat');
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper luna`;
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `
        <div class="typing-orb-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      wrapper.appendChild(div);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
      return wrapper;
    }

    function speakOutLoud(text, targetMsgBubble = null) {
      if (isMuted || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      removeSpeakerAnimation();

      // Filter out all emojis completely
      let textOnly = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F1E6}-\u{1F1FF}]/gu, '').trim();
      
      if (!textOnly) return;

      const utterance = new SpeechSynthesisUtterance(textOnly);
      utterance.rate = 1.0;
      utterance.pitch = 1.3; // Raised pitch for distinct female tone

      if (!femaleVoice) loadFemaleVoice();
      if (femaleVoice) utterance.voice = femaleVoice;

      let waveContainer = null;
      utterance.onstart = () => {
        if (targetMsgBubble) {
          waveContainer = document.createElement('span');
          waveContainer.className = 'speaker-wave-container';
          waveContainer.id = 'active-speaker-anim';
          waveContainer.innerHTML = `
            <span class="speaker-wave-bar"></span>
            <span class="speaker-wave-bar"></span>
            <span class="speaker-wave-bar"></span>
          `;
          targetMsgBubble.appendChild(waveContainer);
        }
      };

      utterance.onend = () => removeSpeakerAnimation();
      utterance.onerror = () => removeSpeakerAnimation();

      window.speechSynthesis.speak(utterance);
    }

    function removeSpeakerAnimation() {
      const activeAnim = document.getElementById('active-speaker-anim');
      if (activeAnim) activeAnim.remove();
    }

    function startVoice() {
      if (isListening || isReplying) return;

      const micBtn = document.getElementById('micBtn');
      const input = document.getElementById('userInput');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Voice input is not supported by your browser.");
        return;
      }

      speechRecognitionInstance = new SpeechRecognition();
      speechRecognitionInstance.continuous = false;
      speechRecognitionInstance.interimResults = true;

      speechRecognitionInstance.onstart = () => {
        isListening = true;
        playBeep(520, 'triangle', 0.15);
        micBtn.classList.add('mic-active');
        input.placeholder = "Listening...";
      };

      speechRecognitionInstance.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        input.value = transcript;
      };

      speechRecognitionInstance.onerror = () => {
        micBtn.classList.remove('mic-active');
        input.placeholder = "Ask Luna anything...";
        isListening = false;
      };

      speechRecognitionInstance.onend = () => {
        micBtn.classList.remove('mic-active');
        input.placeholder = "Ask Luna anything...";
        isListening = false;
        if (input.value.trim() !== '') sendText();
      };

      speechRecognitionInstance.start();
    }
  </script>
</body>
