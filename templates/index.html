<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna.AI</title>
  <style>
    :root {
      --bg-main: #060913;
      --bg-sidebar: #0a0f1d;
      --card-bg: rgba(15, 23, 42, 0.75);
      --diamond-cyan: #00f3ff;
      --diamond-blue: #0088ff;
      --emerald-glow: #00e6a8;
      --prism-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.9);
      --border-color: rgba(0, 243, 255, 0.18);
      --glow-diamond: rgba(0, 243, 255, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    body::before, body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
    }
    body::before { top: -150px; left: -150px; background: var(--diamond-cyan); opacity: 0.15; }
    body::after { bottom: -150px; right: -150px; background: var(--diamond-blue); opacity: 0.15; }

    #app-loader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-main); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 999;
      transition: opacity 0.4s ease;
    }

    .loader-orb {
      width: 60px; height: 60px; border-radius: 50%;
      border: 3px solid transparent; border-top-color: var(--diamond-cyan);
      border-right-color: var(--diamond-blue); animation: spin 0.8s linear infinite;
      box-shadow: 0 0 20px var(--glow-diamond); margin-bottom: 16px;
    }

    .sidebar {
      width: 280px; background: var(--bg-sidebar); display: flex;
      flex-direction: column; justify-content: space-between; padding: 24px 16px;
      border-right: 1px solid var(--border-color); z-index: 10; backdrop-filter: blur(12px);
    }

    .brand-container { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; cursor: pointer; }
    .brand-logo-wrapper {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--diamond-cyan), var(--diamond-blue));
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 15px var(--glow-diamond); overflow: hidden;
    }
    .brand-logo-img { width: 100%; height: 100%; object-fit: cover; }
    .brand-name {
      font-size: 1.25rem; font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--diamond-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .vip-badge {
      font-size: 9px; font-weight: 800; background: linear-gradient(135deg, var(--prism-gold), #d97706);
      color: #000; padding: 2px 6px; border-radius: 4px; letter-spacing: 1px; margin-left: auto;
    }

    .new-chat-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; border-radius: 12px; color: #000; font-weight: 700;
      background: linear-gradient(135deg, var(--diamond-cyan), var(--emerald-glow));
      border: none; cursor: pointer; font-size: 14px; width: 100%; margin-bottom: 20px;
      box-shadow: 0 4px 15px var(--glow-diamond); transition: transform 0.2s;
    }
    .new-chat-btn:hover { transform: translateY(-2px); }

    .recents-label { font-size: 11px; font-weight: 700; color: var(--text-muted); margin: 0 0 10px 4px; text-transform: uppercase; letter-spacing: 1px; }
    .recents-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

    .recent-item-container {
      display: flex; align-items: center; justify-content: space-between;
      border-radius: 8px; transition: background 0.2s;
    }
    .recent-item-container:hover { background: rgba(255, 255, 255, 0.05); }
    .recent-item-container.active { background: rgba(0, 243, 255, 0.12); border-left: 3px solid var(--diamond-cyan); }

    .recent-item {
      display: flex; align-items: center; gap: 10px; padding: 10px;
      color: var(--text-main); background: transparent; border: none;
      cursor: pointer; font-size: 13.5px; flex: 1; text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .sidebar-action-btn {
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
      display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 4px;
    }
    .recent-item-container:hover .sidebar-action-btn { opacity: 1; }
    .sidebar-action-btn:hover { color: var(--diamond-cyan); }

    .profile-section {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 16px; border-top: 1px solid var(--border-color);
    }
    .profile-img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--diamond-cyan); object-fit: cover; }

    .main-content {
      flex: 1; display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
      padding: 30px 24px 20px; position: relative; z-index: 1;
    }

    .hero-container {
      display: flex; flex-direction: column; align-items: center;
      margin-top: auto; margin-bottom: auto; text-align: center;
    }

    .glowing-ring-container {
      position: relative; width: 100px; height: 100px;
      display: flex; justify-content: center; align-items: center; margin-bottom: 20px;
    }

    .diamond-prism {
      position: absolute; width: 65px; height: 65px;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25), rgba(0, 136, 255, 0.35));
      border: 2px solid var(--diamond-cyan); transform: rotate(45deg);
      box-shadow: 0 0 25px var(--glow-diamond); animation: diamondPulse 3s ease-in-out infinite alternate;
    }

    @keyframes diamondPulse {
      0% { transform: rotate(45deg) scale(0.95); }
      100% { transform: rotate(45deg) scale(1.05); box-shadow: 0 0 40px var(--diamond-cyan); }
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .hero-title { font-size: 2.4rem; font-weight: 800; margin-bottom: 20px; }
    .hero-title span { background: linear-gradient(90deg, var(--diamond-cyan), var(--diamond-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .suggestion-container { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .chip {
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color);
      padding: 10px 18px; border-radius: 20px; font-size: 13px; color: var(--text-muted);
      cursor: pointer; transition: all 0.2s ease;
    }
    .chip:hover { background: rgba(0, 243, 255, 0.15); border-color: var(--diamond-cyan); color: #fff; transform: translateY(-2px); }

    .chat-stream {
      width: 100%; max-width: 820px; flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; padding-right: 8px;
    }
    .chat-stream::-webkit-scrollbar { width: 5px; }
    .chat-stream::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 10px; }

    .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.luna { align-self: flex-start; }

    .msg {
      padding: 14px 20px; border-radius: 18px; font-size: 15px; line-height: 1.6;
      backdrop-filter: blur(10px);
    }

    .user .msg {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(0, 136, 255, 0.25));
      border: 1px solid rgba(0, 243, 255, 0.35); border-bottom-right-radius: 4px;
    }

    .luna .msg {
      background: var(--card-bg); border-bottom-left-radius: 4px; border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .luna .msg a { color: var(--diamond-cyan); text-decoration: underline; font-weight: 600; }
    .luna .msg ul { margin-left: 20px; margin-top: 8px; }
    .luna .msg li { margin-bottom: 4px; }

    .msg-actions { display: flex; gap: 6px; margin-top: 4px; opacity: 0; transition: opacity 0.2s; }
    .msg-wrapper:hover .msg-actions { opacity: 1; }
    .user .msg-actions { justify-content: flex-end; }

    .action-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
      color: var(--text-muted); cursor: pointer; font-size: 11px;
      padding: 3px 8px; border-radius: 5px; display: inline-flex; align-items: center; gap: 4px;
    }
    .action-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }

    .input-container {
      width: 100%; max-width: 820px; background: var(--input-bg);
      border: 1px solid var(--border-color); border-radius: 28px;
      padding: 8px 16px 8px 20px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 0 15px var(--glow-diamond);
    }
    .input-container:focus-within { border-color: var(--diamond-cyan); }
    .input-container.disabled { opacity: 0.5; pointer-events: none; }

    .input-container input {
      flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 15px;
    }

    .icon-btn {
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; padding: 6px; border-radius: 50%; transition: color 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .icon-btn:hover { color: var(--diamond-cyan); }
    .mic-active { color: var(--diamond-cyan) !important; animation: pulseMic 1s infinite alternate; }

    @keyframes pulseMic { from { transform: scale(1); } to { transform: scale(1.15); } }

    .disclaimer { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
    #logo-input { display: none; }
  </style>
</head>
<body>

  <div id="app-loader">
    <div class="loader-orb"></div>
    <div style="font-size: 12px; color: var(--diamond-cyan); font-weight: 800; letter-spacing: 2px;">LUNA.AI</div>
  </div>

  <div class="sidebar">
    <div>
      <div class="brand-container" onclick="document.getElementById('logo-input').click()" title="Change Logo">
        <div class="brand-logo-wrapper">
          <img id="brand-logo" class="brand-logo-img" src="static/logo.png" alt="Luna Logo">
        </div>
        <span class="brand-name">Luna.AI</span>
        <span class="vip-badge">VIP</span>
      </div>
      <input type="file" id="logo-input" accept="image/*" onchange="uploadCustomLogo(event)">

      <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>

      <div class="recents-label">Recent Chats</div>
      <div class="recents-list" id="recents-list"></div>
    </div>

    <div class="profile-section">
      <div style="display: flex; align-items: center; gap: 10px;">
        <img class="profile-img" src="static/logo.png" alt="User Profile">
        <div>
          <div style="font-size: 13.5px; font-weight: 600; color: #fff;">Luna Assistant</div>
          <div style="font-size: 11px; color: var(--diamond-cyan);">Online</div>
        </div>
      </div>
      <button class="icon-btn" id="muteBtn" onclick="toggleMute()" title="Mute/Unmute">
        <svg id="muteIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="hero-container" id="hero">
      <div class="glowing-ring-container">
        <div class="diamond-prism"></div>
      </div>
      <div class="hero-title">How can I help you today, <span>Friend?</span></div>
      
      <div class="suggestion-container">
        <div class="chip" onclick="useChip('Who is your developer?')">Who is your developer?</div>
        <div class="chip" onclick="useChip('Tell me more about Arnav Jalwekar')">Developer Profile</div>
        <div class="chip" onclick="useChip('Write a Python script for file automation')">Python Script</div>
      </div>
    </div>

    <div class="chat-stream" id="chat" style="display: none;"></div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="input-container" id="inputContainer">
        <input type="text" id="userInput" placeholder="Ask Luna anything..." onkeydown="if(event.key === 'Enter') sendText()">
        <button class="icon-btn" id="micBtn" onclick="startVoice()" title="Voice Input">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>
        <button class="icon-btn" id="sendBtn" onclick="sendText()" style="color: var(--diamond-cyan);" title="Send">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="disclaimer">Luna.AI — Designed & Developed by Senior Software & Game Developer Arnav Jalwekar</div>
    </div>
  </div>

  <script>
    let isMuted = false;
    let isReplying = false;
    let sessions = [];
    let currentSessionId = null;

    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.style.display = 'none', 400);
        }
      }, 500);

      const savedLogo = localStorage.getItem('vip_custom_logo');
      if (savedLogo) {
        document.getElementById('brand-logo').src = savedLogo;
      }
    });

    function toggleMute() {
      isMuted = !isMuted;
      if (isMuted && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function uploadCustomLogo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('brand-logo').src = e.target.result;
          localStorage.setItem('vip_custom_logo', e.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    function createNewChat() {
      if (isReplying) return;
      currentSessionId = null;
      document.getElementById('chat').innerHTML = '';
      document.getElementById('chat').style.display = 'none';
      document.getElementById('hero').style.display = 'flex';
      renderRecents();
    }

    function renderRecents() {
      const list = document.getElementById('recents-list');
      list.innerHTML = '';
      sessions.forEach(session => {
        const container = document.createElement('div');
        container.className = `recent-item-container ${session.id === currentSessionId ? 'active' : ''}`;
        
        const btn = document.createElement('button');
        btn.className = 'recent-item';
        btn.innerText = session.title;
        btn.onclick = () => loadSession(session.id);

        container.appendChild(btn);
        list.appendChild(container);
      });
    }

    function loadSession(id) {
      if (isReplying) return;
      const session = sessions.find(s => s.id === id);
      if (!session) return;

      currentSessionId = id;
      document.getElementById('hero').style.display = 'none';
      const chat = document.getElementById('chat');
      chat.style.display = 'flex';
      chat.innerHTML = '';

      session.messages.forEach((m) => {
        renderMessageBubble(m.text, m.sender, false);
      });
      renderRecents();
    }

    function useChip(text) {
      document.getElementById('userInput').value = text;
      sendText();
    }

    /* Natural Knowledge Base & Conversational AI Engine */
    function getNaturalResponse(promptText) {
      const q = promptText.trim().toLowerCase();

      // Developer Queries
      if (q.includes('who is your developer') || q.includes('who made you') || q.includes('who created you') || q.includes('who built you') || q.includes('developer') || q.includes('creator')) {
        if (q.includes('more') || q.includes('info') || q.includes('detail') || q.includes('skill') || q.includes('arnav')) {
          return `Arnav Jalwekar is a senior software and native game developer. You can view his developer portfolio and projects on his <a href="https://arnavjalwekar4-code.github.io/about-me/" target="_blank">Arnav Jalwekar GitHub Pages Portfolio</a>.<br><br><b>Technical Skills:</b><ul><li><b>C++ & Systems:</b> Custom game engine architecture, native memory management, and OpenGL.</li><li><b>Java:</b> Enterprise microservices, Spring Boot, and multi-threaded backend systems.</li><li><b>Python:</b> Asynchronous scripting, automation, and data pipelines.</li><li><b>Frontend:</b> Modern responsive CSS, layouts, and animations.</li></ul>`;
        }
        return `I was created by **Arnav Jalwekar**, a senior game developer and software engineer!`;
      }

      // Greetings
      if (/^(hi|hello|hey|greetings|hola|namaste)/.test(q)) {
        return `Hello! How can I assist you today? Feel free to ask me questions, request code, or explore ideas!`;
      }

      // Casual Questions
      if (q.includes('how are you')) {
        return `I'm feeling great and fully operational! How can I help you today?`;
      }
      if (q.includes('what can you do') || q.includes('your capabilities')) {
        return `I can help you write code, debug software, answer general knowledge questions, brainstorm creative ideas, explain technical concepts, and give you details about my developer Arnav Jalwekar!`;
      }

      // Conversational responses for general topics
      return `That's a great question! Here is what you need to know about <b>"${promptText}"</b>:<br><br>• Feel free to ask me to write code, design algorithms, or break down complex ideas.<br>• If you want details about my developer, just ask for <b>Arnav Jalwekar</b>!`;
    }

    async function sendText() {
      if (isReplying) return;
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      isReplying = true;
      document.getElementById('hero').style.display = 'none';
      const chat = document.getElementById('chat');
      chat.style.display = 'flex';

      if (!currentSessionId) {
        currentSessionId = Date.now();
        sessions.unshift({
          id: currentSessionId,
          title: text.substring(0, 22) + '...',
          messages: []
        });
      }

      const sess = sessions.find(s => s.id === currentSessionId);
      sess.messages.push({ text, sender: 'user' });
      renderMessageBubble(text, 'user', false);
      input.value = '';
      renderRecents();

      // Immediate local developer handle for instant accurate response
      const lower = text.toLowerCase();
      let replyText = "";

      if (lower.includes('developer') || lower.includes('creator') || lower.includes('built you') || lower.includes('made you') || lower.includes('arnav')) {
        replyText = getNaturalResponse(text);
      } else {
        try {
          const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          
          if (res.ok) {
            const data = await res.json();
            if (data && data.reply) {
              replyText = data.reply;
            }
          }
        } catch (e) {}

        if (!replyText) {
          replyText = getNaturalResponse(text);
        }
      }

      setTimeout(() => {
        sess.messages.push({ text: replyText, sender: 'luna' });
        renderMessageBubble(replyText, 'luna', true);
        speakOutLoud(replyText);
        isReplying = false;
      }, 300);
    }

    function renderMessageBubble(text, sender, animate = false) {
      const chat = document.getElementById('chat');
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${sender}`;

      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg';

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-btn';
      copyBtn.innerHTML = `Copy`;
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text.replace(/<[^>]*>?/gm, ''));
        copyBtn.innerHTML = `Copied`;
        setTimeout(() => copyBtn.innerHTML = `Copy`, 1500);
      };
      actionsDiv.appendChild(copyBtn);

      wrapper.appendChild(msgDiv);
      wrapper.appendChild(actionsDiv);
      chat.appendChild(wrapper);

      if (animate && sender === 'luna') {
        let i = 0;
        function type() {
          if (i < text.length) {
            msgDiv.innerHTML = text.substring(0, i + 1);
            i += 2;
            chat.scrollTop = chat.scrollHeight;
            setTimeout(type, 10);
          } else {
            msgDiv.innerHTML = text;
          }
        }
        type();
      } else {
        msgDiv.innerHTML = text;
        chat.scrollTop = chat.scrollHeight;
      }
    }

    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice recognition is not supported in this browser.");
        return;
      }

      const recog = new SpeechRecognition();
      recog.lang = 'en-US';
      const micBtn = document.getElementById('micBtn');

      recog.onstart = () => micBtn.classList.add('mic-active');
      recog.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
      };
      recog.onend = () => {
        micBtn.classList.remove('mic-active');
        if (document.getElementById('userInput').value.trim() !== '') {
          sendText();
        }
      };
      recog.start();
    }

    function speakOutLoud(text) {
      if (isMuted || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/<[^>]*>?/gm, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
